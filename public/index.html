<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MongoDB Dashboard</title>
  <meta name="description" content="Dashboard sencillo para lectura y agregado de datos en MongoDB">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Main Content Grid -->
    <main class="dashboard-grid">
      <!-- Left Column: Add Form -->
      <section class="card form-card">
        <div class="card-header">
          <div class="card-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </div>
          <div>
            <h2>Agregar Dato</h2>
          </div>
        </div>

        <form id="add-data-form" class="data-form">
          <div class="form-group">
            <label for="uid-input">UID</label>
            <div class="input-wrapper">
              <input 
                type="text" 
                id="uid-input" 
                placeholder="Ej. 01020304" 
                required 
                autocomplete="off"
                spellcheck="false"
              />
            </div>
          </div>

          <div class="form-group">
            <label for="nombre-input">
              <span>Nombre</span>
            </label>
            <div class="input-wrapper">
              <input 
                type="text" 
                id="nombre-input" 
                placeholder="Ej. cliente" 
                required 
                autocomplete="off"
              />
            </div>
          </div>

          <button type="submit" id="btn-submit" class="btn btn-primary">
            <span class="btn-text">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14M12 5l7 7-7 7"/>
              </svg>
              Guardar
            </span>
            <span class="btn-spinner" style="display: none;">
              <svg class="animate-spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle>
                <path d="M12 2a10 10 0 0 1 10 10"></path>
              </svg>
              Guardando...
            </span>
          </button>
        </form>
      </section>

      <!-- Right Column: Data Viewer -->
      <section class="card table-card">
        <div class="card-header space-between">
          <div class="header-with-icon">
            <div class="card-icon list-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="3" y1="9" x2="21" y2="9"></line>
                <line x1="9" y1="21" x2="9" y2="9"></line>
              </svg>
            </div>
            <div>
              <h2>Datos</h2>
            </div>
          </div>
          <div class="card-actions">
            <div class="search-box">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input type="text" id="search-input" placeholder="Buscar..." />
            </div>
            <button id="btn-refresh" class="btn btn-secondary" title="Actualizar datos">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
              </svg>
              <span>Recargar</span>
            </button>
          </div>
        </div>

        <!-- Data Content Area -->
        <div class="table-container">
          <table class="data-table" id="data-table">
            <thead>
              <tr>
                <th style="width: 25%;">UID</th>
                <th style="width: 35%;">Nombre</th>
                <th style="width: 25%;">_id</th>
                <th style="width: 15%; text-align: right;">Acciones</th>
              </tr>
            </thead>
            <tbody id="table-body">
              <tr class="placeholder-row">
                <td colspan="4" class="text-center">Cargando registros...</td>
              </tr>
            </tbody>
          </table>
          <div id="empty-state" class="empty-state" style="display: none;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
            </svg>
            <p>No hay registros</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
